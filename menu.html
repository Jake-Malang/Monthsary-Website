<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>

    <style>
        /* Three-dot menu */
        .menu {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 1000;
        }

        /* Three dots */
        .menu-button {
            font-size: 30px;
            background: white;
            border: none;
            border-radius: 5px;
            padding: 5px 12px;
            cursor: pointer;
        }

        /* Menu options */
        .menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 5px;
            overflow: hidden;
        }

        /* Show menu when hovering */
        .menu:hover .menu-content {
            display: block;
        }

        /* Menu links */
        .menu-content a {
            display: block;
            padding: 12px 15px;
            text-decoration: none;
            color: black;
        }

        /* Hover effect */
        .menu-content a:hover {
            background-color: #ddd;
        }
        
    </style>
</head>

<body>
    <p>
        Here is the menu page. This is the last page. The purpose of this page is to help you navigate through the other pages with easier access.
    </p>

    <div class="menu">

        <button class="menu-button">⋮</button>

        <div class="menu-content">
            <a href="index.html">Home</a>
            <a href="page2.html">Page 2</a>
            <a href="pictures.html">Pictures</a>
            <a href="moments.html">Random Moments 3</a>
        </div>

    </div>

</body>
</html>
